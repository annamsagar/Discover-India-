server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/discover_india
    username: postgres
    password: liveking04
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: ${JWT_SECRET:myDefaultSecretKeyThatIsAtLeast256BitsLong12345678901234}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

ai:
  api-key: ${AI_API_KEY:}
  provider: ${AI_PROVIDER:gemini}

maps:
  api-key: ${MAPS_API_KEY:}

weather:
  api-key: ${WEATHER_API_KEY:}

logging:
  level:
    com.discoverindia: DEBUG
    org.springframework.security: INFO
