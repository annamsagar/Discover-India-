server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:discover_india
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: ${JWT_SECRET:myDefaultSecretKeyThatIsAtLeast256BitsLong12345678901234}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

ai:
  api-key: ${AI_API_KEY:}
  provider: ${AI_PROVIDER:gemini}

maps:
  api-key: ${MAPS_API_KEY:}

weather:
  api-key: ${WEATHER_API_KEY:}

logging:
  level:
    com.discoverindia: DEBUG
    org.springframework.security: INFO
